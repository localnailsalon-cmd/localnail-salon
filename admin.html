<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>LocalNail Salon — Manage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Allura&family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --cream: #F8F9FA; --cream-soft: #EFF1F3; --ink: #16181B; --ink-soft: #32363B;
            --muted: #676C73; --line: #E1E4E8; --card: #FFFFFF; --accent: #5C626A;
            --ok: #1F7A4D; --warn: #B4402F;
            --steel: linear-gradient(180deg, #5E656D 0%, #1B1E22 42%, #2B2F35 58%, #5A6068 100%);
        }
        * { box-sizing: border-box; }
        [hidden] { display: none !important; }   /* our display rules must not defeat it */
        body {
            margin: 0; font-family: 'Inter', sans-serif; background: var(--cream); color: var(--ink-soft);
            -webkit-font-smoothing: antialiased;
        }
        h1, h2, h3 { font-family: 'Playfair Display', serif; color: var(--ink); margin: 0; font-weight: 400; }
        .logo { font-family: 'Playfair Display', serif; font-size: 1.3rem; color: var(--ink); }
        .logo span {
            font-family: 'Allura', cursive; font-size: 1.5rem; margin-left: .15em;
            background-image: var(--steel); -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        button { font-family: inherit; }
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: .5em;
            min-height: 42px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--ink);
            background: var(--ink); color: #fff; font-size: 12px; font-weight: 600;
            letter-spacing: .12em; text-transform: uppercase; cursor: pointer;
            transition: background .2s, transform .15s, opacity .2s; text-decoration: none;
        }
        .btn:hover { background: #2E3238; }
        .btn:active { transform: scale(.98); }
        .btn[disabled] { opacity: .45; cursor: not-allowed; }
        .btn-ghost { background: transparent; color: var(--ink); }
        .btn-ghost:hover { background: var(--cream-soft); }
        .btn-sm { min-height: 34px; padding: 0 12px; font-size: 11px; letter-spacing: .1em; }
        .btn-danger { background: transparent; color: var(--warn); border-color: #E3C7C1; }
        .btn-danger:hover { background: #FBF0EE; }

        /* ---- login ---- */
        .login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
        .login {
            background: var(--card); border: 1px solid var(--line); border-radius: 22px;
            padding: 40px 32px; width: 100%; max-width: 380px; text-align: center;
            box-shadow: 0 30px 60px -40px rgba(22,24,27,.4);
        }
        .login h1 { font-size: 1.6rem; margin-bottom: 6px; }
        .login p { color: var(--muted); font-size: 13px; margin: 0 0 24px; }

        /* ---- shell ---- */
        header.bar {
            position: sticky; top: 0; z-index: 20; background: rgba(248,249,250,.96);
            border-bottom: 1px solid var(--line); backdrop-filter: blur(8px);
        }
        .bar-in {
            max-width: 1040px; margin: 0 auto; padding: 12px 20px;
            display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
        }
        .bar-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
        .status { font-size: 12px; color: var(--muted); min-width: 92px; text-align: right; }
        .status.dirty { color: var(--warn); }
        .status.saved { color: var(--ok); }

        nav.tabs {
            max-width: 1040px; margin: 0 auto; padding: 0 20px 12px;
            display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none;
        }
        nav.tabs::-webkit-scrollbar { display: none; }
        .tab {
            border: 1px solid var(--line); background: transparent; color: var(--muted);
            border-radius: 999px; padding: 8px 16px; font-size: 11px; font-weight: 600;
            letter-spacing: .12em; text-transform: uppercase; cursor: pointer; white-space: nowrap;
        }
        .tab[aria-selected="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }

        main { max-width: 1040px; margin: 0 auto; padding: 28px 20px 96px; }
        .panel[hidden] { display: none; }
        .card {
            background: var(--card); border: 1px solid var(--line); border-radius: 18px;
            padding: 22px; margin-bottom: 18px;
        }
        .card > h2 { font-size: 1.35rem; margin-bottom: 4px; }
        .card > .hint, .hint { color: var(--muted); font-size: 13px; line-height: 1.6; }
        .grid2 { display: grid; gap: 14px; grid-template-columns: 1fr; }
        @media (min-width: 720px) { .grid2 { grid-template-columns: 1fr 1fr; } }

        label.field { display: block; margin-top: 14px; }
        label.field > span {
            display: block; font-size: 10px; letter-spacing: .18em; text-transform: uppercase;
            font-weight: 600; color: var(--muted); margin-bottom: 6px;
        }
        input, textarea, select {
            width: 100%; font: inherit; font-size: 14px; color: var(--ink);
            background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
        }
        input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
        textarea { min-height: 70px; resize: vertical; }

        .row {
            border: 1px solid var(--line); border-radius: 14px; padding: 14px;
            margin-top: 12px; background: #fff;
        }
        .row-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
        .row-head strong { font-size: 13px; color: var(--ink); }
        .row-tools { margin-left: auto; display: flex; gap: 6px; }
        .icon-btn {
            width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line);
            background: #fff; color: var(--muted); cursor: pointer; font-size: 14px; line-height: 1;
        }
        .icon-btn:hover { color: var(--ink); border-color: #C6CCD3; }

        .photo-row { display: flex; gap: 14px; align-items: flex-start; }
        .thumb {
            width: 104px; height: 104px; flex: none; border-radius: 12px; overflow: hidden;
            background: var(--cream-soft); border: 1px solid var(--line);
        }
        .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .photo-fields { flex: 1; min-width: 0; }
        .file-label {
            display: inline-flex; align-items: center; justify-content: center; min-height: 34px;
            padding: 0 12px; border-radius: 999px; border: 1px solid var(--ink); background: transparent;
            color: var(--ink); font-size: 11px; font-weight: 600; letter-spacing: .1em;
            text-transform: uppercase; cursor: pointer;
        }
        .file-label:hover { background: var(--cream-soft); }
        .file-label input { display: none; }

        .toast {
            position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 20px);
            background: var(--ink); color: #fff; padding: 12px 20px; border-radius: 999px;
            font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 50;
        }
        .toast.show { opacity: 1; transform: translate(-50%, 0); }
        .toast.error { background: var(--warn); }
        .savebar-space { height: 8px; }
    </style>
</head>
<body>

<!-- ---------- login ---------- -->
<div class="login-wrap" id="loginView">
    <form class="login" id="loginForm">
        <h1 class="logo">LocalNail<span>Salon</span></h1>
        <p>Staff sign in</p>
        <label class="field" style="text-align:left">
            <span>Password</span>
            <input type="password" id="password" autocomplete="current-password" required>
        </label>
        <p id="loginError" class="hint" style="color:var(--warn); margin-top:10px" hidden></p>
        <button class="btn" type="submit" style="width:100%; margin-top:18px">Sign in</button>
    </form>
</div>

<!-- ---------- app ---------- -->
<div id="appView" hidden>
    <header class="bar">
        <div class="bar-in">
            <span class="logo">LocalNail<span>Salon</span></span>
            <span class="hint" style="font-size:11px; letter-spacing:.18em; text-transform:uppercase">Manage</span>
            <div class="bar-actions">
                <span class="status" id="status">Loaded</span>
                <a class="btn btn-ghost btn-sm" href="/" target="_blank" rel="noopener">View site</a>
                <button class="btn btn-sm" id="saveBtn" disabled>Save changes</button>
                <button class="btn btn-ghost btn-sm" id="logoutBtn">Sign out</button>
            </div>
        </div>
        <nav class="tabs" id="tabs" role="tablist">
            <button class="tab" role="tab" data-tab="details" aria-selected="true">Salon details</button>
            <button class="tab" role="tab" data-tab="services" aria-selected="false">Services &amp; prices</button>
            <button class="tab" role="tab" data-tab="styles" aria-selected="false">Styles gallery</button>
            <button class="tab" role="tab" data-tab="photos" aria-selected="false">Salon photos</button>
            <button class="tab" role="tab" data-tab="reviews" aria-selected="false">Reviews</button>
        </nav>
    </header>

    <main>
        <section class="panel" id="panel-details"></section>
        <section class="panel" id="panel-services" hidden></section>
        <section class="panel" id="panel-styles" hidden></section>
        <section class="panel" id="panel-photos" hidden></section>
        <section class="panel" id="panel-reviews" hidden></section>
    </main>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
    'use strict';

    var content = null;
    var dirty = false;

    /* ---------- tiny helpers ---------- */
    function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
    }
    function el(id) { return document.getElementById(id); }
    function toast(message, isError) {
        var t = el('toast');
        t.textContent = message;
        t.classList.toggle('error', !!isError);
        t.classList.add('show');
        clearTimeout(t._timer);
        t._timer = setTimeout(function () { t.classList.remove('show'); }, 2600);
    }
    function setDirty(state) {
        dirty = state;
        el('saveBtn').disabled = !state;
        var s = el('status');
        s.textContent = state ? 'Unsaved changes' : 'All changes saved';
        s.className = 'status ' + (state ? 'dirty' : 'saved');
    }
    // "site.address" / "services.0.items.2.price" -> read & write into content
    function getPath(path) {
        return path.split('.').reduce(function (acc, key) { return acc == null ? acc : acc[key]; }, content);
    }
    function setPath(path, value) {
        var keys = path.split('.');
        var last = keys.pop();
        var target = keys.reduce(function (acc, key) { return acc[key]; }, content);
        target[last] = value;
    }

    /* ---------- field builders ---------- */
    function field(label, path, opts) {
        opts = opts || {};
        var value = getPath(path);
        var common = 'data-path="' + esc(path) + '"' + (opts.placeholder ? ' placeholder="' + esc(opts.placeholder) + '"' : '');
        var input = opts.textarea
            ? '<textarea ' + common + '>' + esc(value) + '</textarea>'
            : '<input type="text" ' + common + ' value="' + esc(value) + '">';
        return '<label class="field"><span>' + esc(label) + '</span>' + input +
            (opts.hint ? '<span class="hint" style="text-transform:none;letter-spacing:0;margin-top:6px;display:block">' + esc(opts.hint) + '</span>' : '') +
            '</label>';
    }
    function selectField(label, path, options) {
        var value = getPath(path);
        return '<label class="field"><span>' + esc(label) + '</span><select data-path="' + esc(path) + '">' +
            options.map(function (o) {
                return '<option value="' + esc(o.value) + '"' + (o.value === value ? ' selected' : '') + '>' + esc(o.label) + '</option>';
            }).join('') + '</select></label>';
    }
    // photo picker: thumbnail + replace button + alt text
    function photoField(path, opts) {
        opts = opts || {};
        var entry = getPath(path) || {};
        return '<div class="photo-row">' +
            '<div class="thumb"><img src="' + esc(entry.src || '') + '" alt=""></div>' +
            '<div class="photo-fields">' +
                '<label class="file-label">Replace photo<input type="file" accept="image/*" data-upload="' + esc(path) + '.src"></label>' +
                (opts.caption ? field('Caption (shown under the photo)', path + '.caption') : '') +
                field('Description for screen readers', path + '.alt', { textarea: true }) +
            '</div></div>';
    }

    /* ---------- panels ---------- */
    function renderDetails() {
        var phones = [].concat(content.site.phone || []);
        el('panel-details').innerHTML =
            '<div class="card"><h2>Contact</h2>' +
                '<p class="hint">Shown in the Visit section and in the footer.</p>' +
                field('Address', 'site.address') +
                '<label class="field"><span>Phone numbers</span>' +
                    '<input type="text" data-phones value="' + esc(phones.join(', ')) + '">' +
                    '<span class="hint" style="margin-top:6px;display:block">Separate several numbers with a comma. Each one becomes a tap-to-call link.</span>' +
                '</label>' +
                field('Opening hours', 'site.hours', { placeholder: '10 AM – 10 PM' }) +
            '</div>' +
            '<div class="card"><h2>Links</h2>' +
                '<div class="grid2">' +
                    field('Instagram', 'site.social.instagram') +
                    field('Facebook', 'site.social.facebook') +
                    field('TikTok', 'site.social.tiktok') +
                    field('Google Maps (Get directions)', 'site.directionsUrl') +
                '</div>' +
                field('Booking link', 'site.bookingUrl', { hint: 'Leave empty and the Book buttons scroll to the contact section.' }) +
                field('Google Maps embed link', 'site.mapEmbedUrl', { hint: 'Optional. Share → Embed a map → copy the src link. Empty shows the salon sign photo.' }) +
            '</div>';
    }

    function renderServices() {
        el('panel-services').innerHTML =
            '<div class="card"><h2>Services &amp; prices</h2>' +
            '<p class="hint">Each price appears once here and shows in both the Services list and the price menu.</p></div>' +
            content.services.map(function (cat, ci) {
                return '<div class="card">' +
                    '<div class="row-head"><h3 style="font-size:1.2rem">' + esc(cat.title) + '</h3>' +
                        '<div class="row-tools">' +
                            '<button class="icon-btn" data-move="services" data-i="' + ci + '" data-dir="-1" title="Move up">&uarr;</button>' +
                            '<button class="icon-btn" data-move="services" data-i="' + ci + '" data-dir="1" title="Move down">&darr;</button>' +
                        '</div></div>' +
                    '<div class="grid2">' +
                        field('Category name', 'services.' + ci + '.title') +
                        field('Short line under the name', 'services.' + ci + '.intro') +
                    '</div>' +
                    cat.items.map(function (item, ii) {
                        var base = 'services.' + ci + '.items.' + ii;
                        return '<div class="row">' +
                            '<div class="row-head"><strong>' + esc(item.name || 'New service') + '</strong>' +
                                '<div class="row-tools">' +
                                    '<button class="icon-btn" data-move="services.' + ci + '.items" data-i="' + ii + '" data-dir="-1" title="Move up">&uarr;</button>' +
                                    '<button class="icon-btn" data-move="services.' + ci + '.items" data-i="' + ii + '" data-dir="1" title="Move down">&darr;</button>' +
                                    '<button class="icon-btn" data-remove="services.' + ci + '.items" data-i="' + ii + '" title="Remove">&times;</button>' +
                                '</div></div>' +
                            '<div class="grid2">' + field('Service', base + '.name') + field('Price', base + '.price', { placeholder: '$10' }) + '</div>' +
                            field('Description', base + '.desc', { textarea: true }) +
                        '</div>';
                    }).join('') +
                    '<div class="savebar-space"></div>' +
                    '<button class="btn btn-ghost btn-sm" data-add="services.' + ci + '.items" data-kind="service">+ Add service</button>' +
                '</div>';
            }).join('');
    }

    function renderStyles() {
        var cats = [
            { value: 'extensions', label: 'Extensions' },
            { value: 'chrome', label: 'Chrome & 3D' },
            { value: 'nail-art', label: 'Nail Art' }
        ];
        var shapes = [
            { value: 'tall', label: 'Tall' },
            { value: 'square', label: 'Square' },
            { value: 'wide', label: 'Wide' }
        ];
        el('panel-styles').innerHTML =
            '<div class="card"><h2>Styles gallery</h2>' +
            '<p class="hint">The nail photos in the Styles section. Shape controls how tall the tile is.</p></div>' +
            '<div class="card">' +
            content.gallery.map(function (item, i) {
                return '<div class="row"><div class="row-head"><strong>Photo ' + (i + 1) + '</strong>' +
                    '<div class="row-tools">' +
                        '<button class="icon-btn" data-move="gallery" data-i="' + i + '" data-dir="-1" title="Move up">&uarr;</button>' +
                        '<button class="icon-btn" data-move="gallery" data-i="' + i + '" data-dir="1" title="Move down">&darr;</button>' +
                        '<button class="icon-btn" data-remove="gallery" data-i="' + i + '" title="Remove">&times;</button>' +
                    '</div></div>' +
                    '<div class="photo-row">' +
                        '<div class="thumb"><img src="' + esc(item.src) + '" alt=""></div>' +
                        '<div class="photo-fields">' +
                            '<label class="file-label">Replace photo<input type="file" accept="image/*" data-upload="gallery.' + i + '.src"></label>' +
                            '<div class="grid2">' +
                                selectField('Label', 'gallery.' + i + '.category', cats) +
                                selectField('Tile shape', 'gallery.' + i + '.shape', shapes) +
                            '</div>' +
                            field('Description for screen readers', 'gallery.' + i + '.alt', { textarea: true }) +
                        '</div></div></div>';
            }).join('') +
            '<div class="savebar-space"></div>' +
            '<button class="btn btn-ghost btn-sm" data-add="gallery" data-kind="gallery">+ Add photo</button>' +
            '</div>';
    }

    function renderPhotos() {
        var IMG = content.images;
        el('panel-photos').innerHTML =
            '<div class="card"><h2>Main photos</h2>' +
                '<p class="hint">The storefront at the top, the About photo, the close-up in “More than a manicure”, and the sign in the Visit section.</p>' +
                '<div class="row"><div class="row-head"><strong>Top of the page (storefront)</strong></div>' + photoField('images.hero') + '</div>' +
                '<div class="row"><div class="row-head"><strong>About section</strong></div>' + photoField('images.about') + '</div>' +
                '<div class="row"><div class="row-head"><strong>More than a manicure</strong></div>' + photoField('images.experience') + '</div>' +
                '<div class="row"><div class="row-head"><strong>Visit section (salon sign)</strong></div>' + photoField('images.sign', { caption: true }) + '</div>' +
            '</div>' +
            '<div class="card"><h2>Inside the Salon</h2>' +
                '<p class="hint">The row of square photos. Three across on a computer, swipeable on a phone.</p>' +
                IMG.strip.map(function (item, i) {
                    return '<div class="row"><div class="row-head"><strong>' + esc(item.caption || 'Photo ' + (i + 1)) + '</strong>' +
                        '<div class="row-tools">' +
                            '<button class="icon-btn" data-move="images.strip" data-i="' + i + '" data-dir="-1" title="Move up">&uarr;</button>' +
                            '<button class="icon-btn" data-move="images.strip" data-i="' + i + '" data-dir="1" title="Move down">&darr;</button>' +
                            '<button class="icon-btn" data-remove="images.strip" data-i="' + i + '" title="Remove">&times;</button>' +
                        '</div></div>' +
                        photoField('images.strip.' + i, { caption: true }) + '</div>';
                }).join('') +
                '<div class="savebar-space"></div>' +
                '<button class="btn btn-ghost btn-sm" data-add="images.strip" data-kind="strip">+ Add photo</button>' +
            '</div>';
    }

    function renderReviews() {
        el('panel-reviews').innerHTML =
            '<div class="card"><h2>Reviews</h2>' +
                '<p class="hint">Only publish words a client actually gave you.</p>' +
                content.testimonials.map(function (t, i) {
                    return '<div class="row"><div class="row-head"><strong>Review ' + (i + 1) + '</strong>' +
                        '<div class="row-tools">' +
                            '<button class="icon-btn" data-move="testimonials" data-i="' + i + '" data-dir="-1" title="Move up">&uarr;</button>' +
                            '<button class="icon-btn" data-move="testimonials" data-i="' + i + '" data-dir="1" title="Move down">&darr;</button>' +
                            '<button class="icon-btn" data-remove="testimonials" data-i="' + i + '" title="Remove">&times;</button>' +
                        '</div></div>' +
                        field('What the client said', 'testimonials.' + i + '.quote', { textarea: true }) +
                        field('Who said it', 'testimonials.' + i + '.label', { placeholder: 'LocalNail Client' }) +
                        '</div>';
                }).join('') +
                '<div class="savebar-space"></div>' +
                '<button class="btn btn-ghost btn-sm" data-add="testimonials" data-kind="review">+ Add review</button>' +
            '</div>';
    }

    var renderers = {
        details: renderDetails, services: renderServices,
        styles: renderStyles, photos: renderPhotos, reviews: renderReviews
    };
    function renderPanel(name) { renderers[name](); }
    function renderAll() { Object.keys(renderers).forEach(renderPanel); }

    /* ---------- editing ---------- */
    document.addEventListener('input', function (e) {
        var target = e.target;
        if (target.dataset.path) { setPath(target.dataset.path, target.value); setDirty(true); }
        else if (target.hasAttribute('data-phones')) {
            content.site.phone = target.value.split(',').map(function (s) { return s.trim(); }).filter(Boolean);
            setDirty(true);
        }
    });

    var BLANKS = {
        service: { name: 'New service', price: '$0', desc: '' },
        gallery: { src: '', category: 'nail-art', shape: 'square', alt: '' },
        strip: { src: '', caption: 'New photo', alt: '' },
        review: { quote: '', label: 'LocalNail Client' }
    };

    document.addEventListener('click', function (e) {
        var btn = e.target.closest('button');
        if (!btn) return;
        var panel = btn.closest('.panel');
        var panelName = panel ? panel.id.replace('panel-', '') : null;

        if (btn.dataset.move) {
            var list = getPath(btn.dataset.move);
            var i = +btn.dataset.i, to = i + (+btn.dataset.dir);
            if (to < 0 || to >= list.length) return;
            list.splice(to, 0, list.splice(i, 1)[0]);
            setDirty(true); renderPanel(panelName);
        } else if (btn.dataset.remove) {
            var arr = getPath(btn.dataset.remove);
            if (!confirm('Remove this item? It disappears from the website when you save.')) return;
            arr.splice(+btn.dataset.i, 1);
            setDirty(true); renderPanel(panelName);
        } else if (btn.dataset.add) {
            getPath(btn.dataset.add).push(JSON.parse(JSON.stringify(BLANKS[btn.dataset.kind])));
            setDirty(true); renderPanel(panelName);
        }
    });

    /* ---------- uploads ----------
       The photo is shrunk in the browser first, so a 5 MB phone picture
       travels as a ~150 KB WebP and the website stays fast. */
    function shrink(file, maxSize) {
        return new Promise(function (resolve, reject) {
            var reader = new FileReader();
            reader.onload = function (ev) {
                var img = new Image();
                img.onload = function () {
                    var w = img.width, h = img.height;
                    if (Math.max(w, h) > maxSize) {
                        if (w >= h) { h = Math.round(h * maxSize / w); w = maxSize; }
                        else { w = Math.round(w * maxSize / h); h = maxSize; }
                    }
                    var canvas = document.createElement('canvas');
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    resolve(canvas.toDataURL('image/webp', 0.82));
                };
                img.onerror = function () { reject(new Error('That file is not an image')); };
                img.src = ev.target.result;
            };
            reader.onerror = function () { reject(new Error('Could not read the file')); };
            reader.readAsDataURL(file);
        });
    }

    document.addEventListener('change', function (e) {
        var input = e.target;
        if (!input.dataset.upload) return;
        var file = input.files && input.files[0];
        if (!file) return;
        var path = input.dataset.upload;
        var panel = input.closest('.panel');
        var panelName = panel ? panel.id.replace('panel-', '') : null;
        toast('Uploading photo…');
        shrink(file, path === 'images.hero.src' ? 1600 : 1200)
            .then(function (dataUrl) {
                return fetch('/api/upload', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: file.name, dataUrl: dataUrl })
                });
            })
            .then(function (r) { return r.json().then(function (body) { return { ok: r.ok, body: body }; }); })
            .then(function (res) {
                if (!res.ok) throw new Error(res.body.error || 'Upload failed');
                setPath(path, res.body.src);
                // the hero also carries a small version; point it at the same file
                if (path === 'images.hero.src') content.images.hero.srcSmall = res.body.src;
                setDirty(true);
                renderPanel(panelName);
                toast('Photo added — press Save changes');
            })
            .catch(function (err) { toast(err.message, true); });
    });

    /* ---------- save / session ---------- */
    el('saveBtn').addEventListener('click', function () {
        el('saveBtn').disabled = true;
        el('status').textContent = 'Saving…';
        fetch('/api/content', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(content)
        }).then(function (r) { return r.json().then(function (body) { return { ok: r.ok, body: body }; }); })
          .then(function (res) {
              if (!res.ok) throw new Error(res.body.error || 'Could not save');
              setDirty(false);
              toast('Saved — the website is updated');
          })
          .catch(function (err) { setDirty(true); toast(err.message, true); });
    });

    window.addEventListener('beforeunload', function (e) {
        if (dirty) { e.preventDefault(); e.returnValue = ''; }
    });

    el('tabs').addEventListener('click', function (e) {
        var tab = e.target.closest('.tab');
        if (!tab) return;
        [].forEach.call(document.querySelectorAll('.tab'), function (t) {
            t.setAttribute('aria-selected', String(t === tab));
        });
        [].forEach.call(document.querySelectorAll('.panel'), function (p) {
            p.hidden = p.id !== 'panel-' + tab.dataset.tab;
        });
    });

    el('logoutBtn').addEventListener('click', function () {
        if (dirty && !confirm('You have unsaved changes. Sign out anyway?')) return;
        fetch('/api/logout', { method: 'POST' }).then(function () { location.reload(); });
    });

    el('loginForm').addEventListener('submit', function (e) {
        e.preventDefault();
        var error = el('loginError');
        error.hidden = true;
        fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: el('password').value })
        }).then(function (r) { return r.json().then(function (body) { return { ok: r.ok, body: body }; }); })
          .then(function (res) {
              if (!res.ok) { error.textContent = res.body.error || 'Wrong password'; error.hidden = false; return; }
              start();
          })
          .catch(function () { error.textContent = 'Could not reach the server'; error.hidden = false; });
    });

    function start() {
        fetch('/api/content', { cache: 'no-store' })
            .then(function (r) { return r.json(); })
            .then(function (data) {
                content = data;
                el('loginView').hidden = true;
                el('appView').hidden = false;
                renderAll();
                setDirty(false);
                el('status').textContent = 'Loaded';
                el('status').className = 'status';
            })
            .catch(function () { toast('Could not load the content', true); });
    }

    fetch('/api/session').then(function (r) { return r.json(); }).then(function (s) {
        if (s.signedIn) start();
    }).catch(function () {});
})();
</script>
</body>
</html>
