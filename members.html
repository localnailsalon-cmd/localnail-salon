<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly Membership — LocalNail Salon</title>
    <meta name="description" content="Join the LocalNail Salon monthly membership in Siem Reap: pick a plan, choose a start date, and we confirm by phone.">
    <link rel="canonical" href="https://localnailsalon.tech/membership">
    <meta name="theme-color" content="#0E0F11">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Allura&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..600;1,6..96,400&family=Inter:wght@400;500;600;700&family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --night: #0E0F11; --night-card: #1B1D21; --night-line: rgba(255, 255, 255, .1);
            --night-muted: #A3A9B1; --ink: #16181B; --cream: #F8F9FA; --warn: #E0806F; --ok: #7FD1A6;
            --chrome: linear-gradient(180deg, #FFFFFF 0%, #D8DCE2 22%, #99A0A8 50%, #C7CCD3 72%, #F5F7F9 100%);
            --chrome-light: linear-gradient(180deg, #FFFFFF 0%, #EEF0F3 30%, #AEB5BD 58%, #E6E9EC 80%, #FFFFFF 100%);
            color-scheme: dark;
        }
        * { box-sizing: border-box; }
        [hidden] { display: none !important; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            margin: 0; background: var(--night); color: #E7E9EC;
            font-family: 'Inter', 'Kantumruy Pro', sans-serif; -webkit-font-smoothing: antialiased;
        }
        html[lang="km"] body { font-family: 'Kantumruy Pro', 'Inter', sans-serif; }
        a { color: inherit; }
        :focus-visible { outline: 2px solid #C7CCD3; outline-offset: 3px; border-radius: 6px; }
        .wrap { max-width: 760px; margin: 0 auto; padding: 0 20px; }

        header {
            position: sticky; top: 0; z-index: 10; height: 60px;
            background: rgba(14, 15, 17, .9); border-bottom: 1px solid var(--night-line);
            -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
        }
        header .wrap { max-width: 1100px; height: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .logo { font-family: 'Playfair Display', 'Bodoni Moda', serif; color: #fff; text-decoration: none; font-size: 1.3rem; white-space: nowrap; }
        .logo span { font-family: 'Allura', cursive; font-size: 1.34em; margin-left: .18em; background: var(--chrome-light); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .pill {
            height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, .22);
            color: #fff; background: transparent; font: 600 12px/1 'Kantumruy Pro', 'Inter', sans-serif;
            text-decoration: none; display: inline-flex; align-items: center; cursor: pointer;
        }

        .eyebrow { font-size: 11px; letter-spacing: .28em; text-transform: uppercase; font-weight: 600; color: var(--night-muted); display: flex; align-items: center; gap: 10px; margin: 0 0 16px; }
        .eyebrow::before { content: ''; width: 22px; height: 1px; background: currentColor; }
        .display {
            font-family: 'Bodoni Moda', Georgia, serif; font-weight: 500; text-transform: uppercase; color: #fff;
            font-size: clamp(2.4rem, 11vw, 4.6rem); line-height: 1; margin: 0;
        }
        .acc {
            font-family: 'Allura', cursive; font-weight: 400; text-transform: none; font-size: 1.28em; line-height: .8;
            display: inline-block; padding: 0 .08em .16em; margin-left: .7em; white-space: nowrap;
            background: var(--chrome-light); -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        html[lang="km"] .eyebrow { letter-spacing: .03em; text-transform: none; font-size: 13px; }
        html[lang="km"] .display { font-family: 'Kantumruy Pro', sans-serif; font-weight: 700; text-transform: none; font-size: clamp(2rem, 9vw, 3.6rem); line-height: 1.3; }
        html[lang="km"] .acc { font-family: 'Kantumruy Pro', sans-serif; font-size: 1em; line-height: 1.3; margin-left: 0; font-weight: 400; }
        .lede { color: var(--night-muted); font-size: 1.05rem; line-height: 1.75; margin: 20px 0 0; max-width: 52ch; }
        html[lang="km"] .lede { line-height: 1.9; }

        .hero { padding: 56px 0 36px; }
        .step { margin-top: 38px; }
        .step h2 { display: flex; align-items: baseline; gap: 12px; margin: 0 0 16px; font-weight: 600; font-size: 1.1rem; color: #fff; }
        .step h2 b { font-family: 'Bodoni Moda', serif; font-style: italic; font-weight: 400; color: var(--night-muted); font-size: 1.2rem; }

        /* plans */
        .plans { display: grid; gap: 12px; }
        @media (min-width: 720px) { .plans { grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); } }
        .plan { position: relative; display: block; cursor: pointer; }
        .plan input { position: absolute; opacity: 0; pointer-events: none; }
        .plan .card, .opt .card, .plan .top { display: block; }
        .plan .top { display: flex; }
        .plan .card {
            height: 100%; border-radius: 18px; padding: 18px; background: var(--night-card);
            border: 1px solid var(--night-line); transition: border-color .2s, background .2s, transform .2s;
        }
        .plan:hover .card { border-color: rgba(255, 255, 255, .24); }
        .plan input:checked + .card { border-color: #fff; background: linear-gradient(160deg, #272A2F, #1B1D21 65%); }
        .plan input:focus-visible + .card { outline: 2px solid #C7CCD3; outline-offset: 3px; }
        .plan .top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
        .plan h3 { margin: 0; color: #fff; font-size: 1.05rem; font-weight: 600; }
        .price { font-family: 'Bodoni Moda', serif; font-weight: 600; font-size: 1.5rem; line-height: 1; white-space: nowrap; background: var(--chrome-light); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .price.ask { font-family: 'Inter', 'Kantumruy Pro', sans-serif; font-size: .8rem; font-weight: 600; -webkit-text-fill-color: var(--night-muted); color: var(--night-muted); }
        .period { color: var(--night-muted); font-size: 12px; margin-top: 4px; }
        .plan ul { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 7px; }
        .plan li { color: #D5D9DE; font-size: .92rem; line-height: 1.45; padding-left: 20px; position: relative; }
        .plan li::before { content: ''; position: absolute; left: 2px; top: .5em; width: 9px; height: 5px; border-left: 1.5px solid #C7CCD3; border-bottom: 1.5px solid #C7CCD3; transform: rotate(-45deg); }
        .tick { position: absolute; top: 14px; right: 14px; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--night-line); }
        .plan input:checked + .card .tick { background: var(--chrome); border-color: transparent; }
        .plan input:checked + .card .tick::after { content: ''; position: absolute; left: 7px; top: 5px; width: 6px; height: 10px; border-right: 2px solid var(--ink); border-bottom: 2px solid var(--ink); transform: rotate(45deg); }
        .plan .top { padding-right: 30px; }

        /* fields */
        .fields { display: grid; gap: 14px; }
        @media (min-width: 640px) { .fields.two { grid-template-columns: 1fr 1fr; } }
        label.f { display: block; }
        label.f > span { display: block; font-size: 12px; font-weight: 600; color: var(--night-muted); margin-bottom: 7px; letter-spacing: .02em; }
        input[type=text], input[type=tel], input[type=date], textarea {
            width: 100%; font: inherit; font-size: 16px; color: #fff; background: #15171A;
            border: 1px solid rgba(255, 255, 255, .16); border-radius: 12px; padding: 13px 14px; min-height: 50px;
        }
        textarea { min-height: 84px; resize: vertical; }
        input:focus, textarea:focus { outline: none; border-color: #fff; }
        .err { color: var(--warn); font-size: 13px; margin-top: 6px; }
        .field-bad input { border-color: var(--warn); }

        /* payment */
        .pay { display: grid; gap: 10px; }
        @media (min-width: 640px) { .pay { grid-template-columns: 1fr 1fr; } }
        .opt { position: relative; cursor: pointer; }
        .opt input { position: absolute; opacity: 0; pointer-events: none; }
        .opt .card { border-radius: 14px; padding: 14px 16px 14px 48px; background: var(--night-card); border: 1px solid var(--night-line); position: relative; min-height: 64px; }
        .opt .card::before { content: ''; position: absolute; left: 16px; top: 18px; width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid #8C939B; }
        .opt input:checked + .card { border-color: #fff; }
        .opt input:checked + .card::before { border: 6px solid #fff; }
        .opt input:focus-visible + .card { outline: 2px solid #C7CCD3; outline-offset: 3px; }
        .opt b { display: block; color: #fff; font-weight: 600; }
        .opt small { color: var(--night-muted); font-size: 12.5px; }
        .qr-box { margin-top: 14px; border-radius: 18px; background: #fff; color: var(--ink); padding: 18px; display: grid; gap: 14px; }
        @media (min-width: 640px) { .qr-box { grid-template-columns: 220px 1fr; align-items: center; } }
        .qr-box img { width: 100%; max-width: 240px; height: auto; display: block; margin: 0 auto; border-radius: 10px; }
        .qr-box h3 { margin: 0 0 6px; font-size: 1rem; }
        .qr-box p { margin: 0 0 8px; color: #4A5058; font-size: .92rem; line-height: 1.6; }
        .qr-amount { font-family: 'Bodoni Moda', serif; font-weight: 600; font-size: 1.6rem; color: var(--ink); }
        .upload {
            display: inline-flex; align-items: center; gap: 8px; margin-top: 6px; cursor: pointer;
            border: 1px dashed #9AA1A9; border-radius: 12px; padding: 10px 14px; font-size: 13px; font-weight: 600; color: var(--ink);
        }
        .upload input { display: none; }
        .slip-preview { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 13px; color: #4A5058; }
        .slip-preview img { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; }
        .linkish { background: none; border: 0; color: #4A5058; text-decoration: underline; cursor: pointer; font: inherit; font-size: 13px; padding: 0; }

        .submit {
            margin-top: 34px; width: 100%; min-height: 56px; border: 0; border-radius: 999px; cursor: pointer;
            background: var(--chrome); color: var(--ink); font: 700 13px/1 'Inter', 'Kantumruy Pro', sans-serif;
            letter-spacing: .16em; text-transform: uppercase; box-shadow: inset 0 1px 0 #fff;
        }
        html[lang="km"] .submit { letter-spacing: .02em; text-transform: none; font-size: 15px; }
        .submit[disabled] { opacity: .6; cursor: progress; }
        .fine { color: var(--night-muted); font-size: 12.5px; line-height: 1.6; margin-top: 14px; text-align: center; }
        .form-err { margin-top: 16px; padding: 12px 14px; border-radius: 12px; background: rgba(224, 128, 111, .12); border: 1px solid rgba(224, 128, 111, .4); color: #F2B8AD; font-size: 14px; }

        .done { text-align: center; padding: 60px 0 90px; }
        .done .mark { width: 72px; height: 72px; margin: 0 auto 26px; border-radius: 50%; background: var(--chrome); position: relative; }
        .done .mark::after { content: ''; position: absolute; left: 27px; top: 17px; width: 14px; height: 28px; border-right: 3px solid var(--ink); border-bottom: 3px solid var(--ink); transform: rotate(45deg); }
        .done .lede { margin-left: auto; margin-right: auto; }
        .ghost { display: inline-flex; margin-top: 28px; min-height: 48px; align-items: center; padding: 0 24px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, .35); text-decoration: none; color: #fff; font-weight: 600; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; }
        html[lang="km"] .ghost { letter-spacing: 0; text-transform: none; font-size: 14px; }
        footer { border-top: 1px solid var(--night-line); padding: 26px 0 40px; color: var(--night-muted); font-size: 13px; }
        .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
    </style>
</head>
<body>
    <header>
        <div class="wrap">
            <a class="logo" href="/" aria-label="LocalNail Salon — home">LocalNail<span>Salon</span></a>
            <div style="display:flex;gap:6px">
                <button type="button" class="pill" id="langBtn">ខ្មែរ</button>
                <a class="pill" href="/" data-i="back">Back to site</a>
            </div>
        </div>
    </header>

    <main class="wrap">
        <section class="hero">
            <p class="eyebrow" data-i="eyebrow">Monthly membership</p>
            <h1 class="display" data-i="title">Your nails,<br><span class="acc">every month.</span></h1>
            <p class="lede" id="intro"></p>
        </section>

        <form id="form" novalidate>
            <div class="step">
                <h2><b>01</b><span data-i="s1">Choose your plan</span></h2>
                <div class="plans" id="plans" role="radiogroup" aria-label="Plans"></div>
                <p class="err" id="err-plan" hidden></p>
            </div>

            <div class="step">
                <h2><b>02</b><span data-i="s2">Your details</span></h2>
                <div class="fields two">
                    <label class="f" id="f-name"><span data-i="name">Full name</span>
                        <input type="text" id="name" name="name" autocomplete="name" maxlength="80" required>
                        <p class="err" hidden></p>
                    </label>
                    <label class="f" id="f-phone"><span data-i="phone">Phone number</span>
                        <input type="tel" id="phone" name="phone" autocomplete="tel" inputmode="tel" maxlength="20" placeholder="012 345 678" required>
                        <p class="err" hidden></p>
                    </label>
                    <label class="f" id="f-startDate"><span data-i="start">Start date</span>
                        <input type="date" id="startDate" name="startDate" required>
                        <p class="err" hidden></p>
                    </label>
                    <label class="f"><span data-i="note">Note (optional)</span>
                        <input type="text" id="note" name="note" maxlength="300">
                    </label>
                </div>
                <div class="hp" aria-hidden="true"><label>Website <input type="text" id="website" tabindex="-1" autocomplete="off"></label></div>
            </div>

            <div class="form-err" id="formErr" hidden></div>
            <button class="submit" type="submit" id="submitBtn" data-i="submit">Join the membership</button>
            <p class="fine" data-i="fine">After you send this, the salon will contact you to talk through the details.</p>
        </form>

        <section class="done" id="done" hidden>
            <div class="mark" aria-hidden="true"></div>
            <h1 class="display" data-i="doneT">Thank you<br><span class="acc">see you soon.</span></h1>
            <p class="lede" id="doneText"></p>
            <a class="ghost" href="/" data-i="back">Back to site</a>
        </section>
    </main>

    <footer><div class="wrap">&copy; 2026 LocalNail Salon &middot; <span id="footAddr"></span></div></footer>

    <script src="salon-data.js"></script>
    <script>
    (function () {
        'use strict';
        var DATA = window.SALON;
        var KM = {
            back: 'ត្រឡប់ទៅទំព័រដើម', eyebrow: 'សមាជិកប្រចាំខែ',
            title: 'ក្រចកស្អាត<br><span class="acc">រៀងរាល់ខែ</span>',
            s1: 'ជ្រើសរើសកញ្ចប់', s2: 'ព័ត៌មានរបស់អ្នក', s3: 'ការបង់ប្រាក់',
            name: 'ឈ្មោះពេញ', phone: 'លេខទូរស័ព្ទ', start: 'ថ្ងៃចាប់ផ្តើម', note: 'កំណត់សម្គាល់ (មិនចាំបាច់)',
            paySalon: 'បង់នៅហាង', paySalonD: 'បង់ពេលមកលើកដំបូង។ យើងនឹងហៅទូរស័ព្ទបញ្ជាក់។',
            payQr: 'បង់ឥឡូវតាម KHQR', payQrD: 'ស្កេនជាមួយ ABA ឬកម្មវិធីធនាគារ Bakong ណាមួយ។',
            qrHow: 'បើកកម្មវិធីធនាគារ ស្កេនកូដ ហើយបង់ចំនួនខាងក្រោម។ បន្ទាប់មកបញ្ចូលរូបថតអេក្រង់នៃការបង់ប្រាក់ ដើម្បីឲ្យយើងផ្ទៀងផ្ទាត់។',
            slip: 'បញ្ចូលរូបថតការបង់ប្រាក់', slipOk: 'បានបញ្ចូលរូបថតរួច', remove: 'លុប',
            submit: 'ចុះឈ្មោះជាសមាជិក', fine: 'បន្ទាប់ពីផ្ញើរួច ហាងនឹងទាក់ទងទៅអ្នកវិញ ដើម្បីពិភាក្សាព័ត៌មានលម្អិត។',
            doneT: 'អរគុណ<br><span class="acc">ជួបគ្នាឆាប់ៗ</span>'
        };
        var T = {
            en: {

                errPlan: 'Choose a plan.', errName: 'Enter your name.', errPhone: 'Enter a phone number we can call.',

                errNet: 'No connection. Check your internet and try again.', errMany: 'Too many sign-ups from this device. Please call the salon.',

                done: function (n, p, plan, date) { return 'Thanks, ' + n + '. Your request for ' + plan + ' starting ' + date + ' is in. We will call you on ' + p + ' to confirm.'; },
                amount: function (price) { return price; }
            },
            km: {
                ask: 'សូមសាកសួរតម្លៃ', perMonth: 'ក្នុងមួយខែ',
                errPlan: 'សូមជ្រើសរើសកញ្ចប់។', errName: 'សូមបញ្ចូលឈ្មោះ។', errPhone: 'សូមបញ្ចូលលេខទូរស័ព្ទដែលអាចទាក់ទងបាន។',
                errStart: 'សូមជ្រើសថ្ងៃចាប់ផ្តើម ពីថ្ងៃនេះទៅ។', errServer: 'មានបញ្ហាពីខាងយើង។ សូមព្យាយាមម្តងទៀត ឬហៅទូរស័ព្ទមកហាង។',
                errNet: 'គ្មានអ៊ីនធឺណិត។ សូមពិនិត្យការតភ្ជាប់ ហើយព្យាយាមម្តងទៀត។', errMany: 'ចុះឈ្មោះច្រើនដងពេកពីឧបករណ៍នេះ។ សូមហៅទូរស័ព្ទមកហាង។',
                errSlip: 'មិនអាចប្រើរូបថតនេះបានទេ។ សូមសាកល្បងរូបផ្សេង។', sending: 'កំពុងផ្ញើ…',
                done: function (n, p, plan, date) { return 'អរគុណ ' + n + '។ យើងបានទទួលសំណើរ ' + plan + ' ចាប់ពី ' + date + ' ហើយ។ យើងនឹងហៅទៅលេខ ' + p + ' ដើម្បីបញ្ជាក់។'; },
                amount: function (price) { return price; }
            }
        };
        var LANG = 'en';
        try { if (localStorage.getItem('ln-lang') === 'km') LANG = 'km'; } catch (e) {}
        var ORIG = new Map();
        function t(k) { return T[LANG][k]; }
        function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
        function isSet(v) { return v && String(v).trim() && String(v).indexOf('[') !== 0; }
        function $(id) { return document.getElementById(id); }

        function applyLang(save) {
            document.documentElement.lang = LANG;
            document.querySelectorAll('[data-i]').forEach(function (el) {
                if (!ORIG.has(el)) ORIG.set(el, el.innerHTML);
                el.innerHTML = LANG === 'km' && KM[el.dataset.i] ? KM[el.dataset.i] : ORIG.get(el);

            $('langBtn').textContent = LANG === 'km' ? 'English' : 'ខ្មែរ';
            if (save) { try { localStorage.setItem('ln-lang', LANG); } catch (e) {} }
            if (M) renderPlans();
            clearErrors();
        }
        $('langBtn').addEventListener('click', function () { LANG = LANG === 'km' ? 'en' : 'km'; applyLang(true); });

        var M = null;
        var selected = null;
        function renderPlans() {
            $('intro').textContent = M.intro || '';
            var plans = (M.plans || []).filter(function (p) { return isSet(p.name); });
            $('plans').innerHTML = plans.map(function (p) {
                var price = isSet(p.price) ? '<span class="price">' + esc(p.price) + '</span>' : '<span class="price ask">' + esc(t('ask')) + '</span>';
                var lines = String(p.includes || '').split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
                return '<label class="plan"><input type="radio" name="plan" value="' + esc(p.id) + '"' + (p.id === selected ? ' checked' : '') + '>' +
                    '<span class="card"><span class="tick" aria-hidden="true"></span>' +
                    '<span class="top"><h3>' + esc(p.name) + '</h3>' + price + '</span>' +
                    (isSet(p.price) ? '<div class="period">' + esc(p.period || t('perMonth')) + '</div>' : '') +
                    (lines.length ? '<ul>' + lines.map(function (l) { return '<li>' + esc(l) + '</li>'; }).join('') + '</ul>' : '') +
                    '</span></label>';
            }).join('');
            updateQr();
        }
        function currentPlan() {
            return (M.plans || []).filter(function (p) { return p.id === selected; })[0];
        }
        $('plans').addEventListener('change', function (e) {
            if (e.target.name === 'plan') { selected = e.target.value; showErr('plan', ''); updateQr(); }
        });

        /* payment */
        // payment is arranged in person at the salon
        function payment() { return 'salon'; }
        function updateQr() {}

        /* validation */
        function showErr(field, msg) {
            if (field === 'plan') { $('err-plan').textContent = msg; $('err-plan').hidden = !msg; return; }
            var wrap = $('f-' + field), p = wrap.querySelector('.err');
            p.textContent = msg; p.hidden = !msg;
            wrap.classList.toggle('field-bad', !!msg);
        }
        function showForm(msg) { $('formErr').textContent = msg; $('formErr').hidden = !msg; }
        function clearErrors() { ['plan', 'name', 'phone', 'startDate'].forEach(function (f) { showErr(f, ''); }); showForm(''); }

        function todayISO() {
            var d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
            return d.toISOString().slice(0, 10);
        }
        // an error message goes away as soon as the field is corrected
        ['name', 'phone', 'startDate'].forEach(function (f) { $(f).addEventListener('input', function () { showErr(f, ''); }); });
        $('startDate').min = todayISO();
        $('startDate').value = todayISO();

        $('form').addEventListener('submit', function (e) {
            e.preventDefault();
            clearErrors();
            var name = $('name').value.trim(), phone = $('phone').value.trim(), start = $('startDate').value;
            var first = null;
            function bad(f, msg) { showErr(f, msg); first = first || f; }
            if (!selected) bad('plan', t('errPlan'));
            if (name.length < 2) bad('name', t('errName'));
            if (!/^\+?[\d\s-]{6,20}$/.test(phone)) bad('phone', t('errPhone'));
            if (!start || start < todayISO()) bad('startDate', t('errStart'));
            if (first) {
                var target = first === 'plan' ? $('plans') : $(first);
                target.scrollIntoView({ behavior: 'smooth', block: 'center' });
                if (first !== 'plan') $(first).focus({ preventScroll: true });
                return;
            }
            var btn = $('submitBtn'), label = btn.innerHTML;
            btn.disabled = true; btn.textContent = t('sending');
            fetch('/api/members', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    planId: selected, name: name, phone: phone, startDate: start, note: $('note').value.trim(),
                    payment: payment(), receipt: '', website: $('website').value
                })
            }).then(function (r) { return r.json().then(function (b) { return { status: r.status, body: b }; }); })
              .then(function (res) {
                  btn.disabled = false; btn.innerHTML = label;
                  if (res.status === 200) {
                      var plan = currentPlan();
                      $('doneText').textContent = t('done')(name, phone, plan ? plan.name : '', start);
                      $('form').hidden = true; document.querySelector('.hero').hidden = true; $('done').hidden = false;
                      window.scrollTo(0, 0);
                      return;
                  }
                  var code = res.body && res.body.error;
                  if (res.status === 429) return showForm(t('errMany'));
                  if (code === 'name') return bad('name', t('errName'));
                  if (code === 'phone') return bad('phone', t('errPhone'));
                  if (code === 'startDate') return bad('startDate', t('errStart'));
                  if (code === 'plan') return bad('plan', t('errPlan'));
                  if (code === 'receipt') return showForm(t('errSlip'));
                  showForm(t('errServer'));
              })
              .catch(function () { btn.disabled = false; btn.innerHTML = label; showForm(t('errNet')); });
        });

        fetch('/api/content', { cache: 'no-store' })
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (d) { if (d && d.site) DATA = d; })
            .catch(function () {})
            .then(function () {
                M = DATA.membership || { plans: [] };
                $('footAddr').textContent = DATA.site.address || '';
                applyLang(false);
            });
    })();
    </script>
</body>
</html>
